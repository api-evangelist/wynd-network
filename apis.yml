aid: wynd-network
name: Wynd Network
description: 'Wynd Network (now operating as Wynd Labs) is the company behind Grass,
  a decentralized physical infrastructure network (DePIN) on Solana that rewards
  users for sharing their unused internet bandwidth. The Grass Network routes and
  verifies web traffic through a network of nodes, routers, and validators to collect
  and structure public web data for AI training and business intelligence. Grass
  ships consumer apps and a node network rather than a public developer API; its
  documentation covers network architecture, the GRASS token, staking, and points.'
